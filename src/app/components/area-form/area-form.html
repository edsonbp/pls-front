<mat-card appearance="outlined">

    <mat-card-header>
        <mat-card-title>
            nova área
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-form-field>
            <mat-label>Sigla</mat-label>
            <input matInput>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Nome</mat-label>
            <input matInput>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Nome</mat-label>
            <mat-select>
                <mat-option value="one">First option</mat-option>
                <mat-option value="two">Second option</mat-option>
            </mat-select>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Superior</mat-label>
            <mat-select>
                <mat-option value="one">First option</mat-option>
                <mat-option value="two">Second option</mat-option>
            </mat-select>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Pls</mat-label>
            <mat-select>
                <mat-option value="one">First option</mat-option>
                <mat-option value="two">Second option</mat-option>
            </mat-select>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Link</mat-label>
            <input matInput>
        </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
        <button  (click)="toRoute('area-list')">
            <mat-icon>
                <mat-icon>arrow_left</mat-icon>
            </mat-icon>
        </button>
        <button  (click)="confirm()">
            <mat-icon>
                <mat-icon>check</mat-icon>
            </mat-icon>
        </button>
    </mat-card-actions>
</mat-card>
