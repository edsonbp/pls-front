<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      respostas PLS ({{ total_registros }})
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <!-- <button  (click)="toRoute('area-form')">
      <mat-icon>
        <mat-icon>add</mat-icon>
      </mat-icon>
    </button> -->
    <mat-form-field appearance="outline" style="float: left; width:100%;margin-top: 10px;">
        <mat-label>Filtrar dados</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="filtrar" #input>
    </mat-form-field>
      <div style="height: 400px;overflow-y: auto;border:1px solid gray">
        <table mat-table [dataSource]="data_source" matSort class="mat-elevation-z8" row-item-container-height="5">
          <ng-container matColumnDef="area">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> área </th>
            <td mat-cell *matCellDef="let element"> {{element.area}} </td>
          </ng-container>
          <ng-container matColumnDef="indicador">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> indicador </th>
            <td mat-cell *matCellDef="let element"> {{element.indicador}} </td>
          </ng-container>
          <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> data </th>
            <td mat-cell *matCellDef="let element"> {{element.data}} </td>
          </ng-container>
          <ng-container matColumnDef="mes">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> mes  </th>
            <td mat-cell *matCellDef="let element"> {{element.mes}} </td>
          </ng-container>
          <ng-container matColumnDef="ano">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ano </th>
            <td mat-cell *matCellDef="let element"> {{element.ano}} </td>
          </ng-container>
          <ng-container matColumnDef="resposta">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> resposta </th>
            <td mat-cell *matCellDef="let element"> {{element.resposta}} </td>
          </ng-container>
          <ng-container matColumnDef="bloqueada">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> bloqueada </th>
            <td mat-cell *matCellDef="let element"> {{element.bloqueada}} </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: columns;"></tr> 
        </table>
      </div>
      <div>
        <div style="width:50%;float: left;">
          <button matButton="elevated" style="margin-top: 5px;" (click)="bloquear(data_bloqueio)">
            Bloquear até {{ data_bloqueio }}
          </button>
          <!-- <button matButton="elevated" style="margin-top: 5px;" (click)="bloquear(data_bloqueio)">
            Gravar no banco de dados até {{ data_formatada }}
          </button> -->
          <button matButton="elevated" style="margin-top: 5px;" (click)="importar(data_bloqueio)">
            Importar Respostas
          </button>
        </div>
        <div style="width:50%; float: left;">
          <mat-paginator [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
        </div>
      </div>
  </mat-card-content>
</mat-card>
